<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Martins-Lieder 2026</title>
  <meta http-equiv="refresh" content="0; url=martinslieder.pdf">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #fdfbf7;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #c0392b;
    }
    p {
      margin-bottom: 24px;
      color: #666;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #d35400;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 1.1rem;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #b94600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏮 St. Martins-Lieder 2026</h1>
    <p>Das Liederheft wird geladen. Falls die Weiterleitung nicht automatisch startet, klicke auf den Button:</p>
    <a class="btn" href="martinslieder.pdf">Liederheft öffnen (PDF)</a>
  </div>
</body>
</html>
